[test]
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/tests/**",
  "./result/**",
  "../compiler/**",
  "../create/**",
  "../desktop/**",
  "../parser/**",
  "../runtime/**",
  "../schema/**",
  "../server/**",
  "../starters/**",
  "../studio/**",
]
coverageThreshold = { lines = 0.85, functions = 0.99 }
