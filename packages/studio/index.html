      .git-file-info {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 6px;
        overflow: hidden;
      }
      .git-file-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .git-file-dir {
        font-size: 10px;
        color: var(--fg-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .git-file-actions {
        display: flex;
        gap: 0;
        opacity: 0;
      }
      .git-file-row:hover .git-file-actions {
        opacity: 1;
      }
      .git-file-badge {
        flex-shrink: 0;
        width: 16px;
        text-align: center;
        font-size: 10px;
        font-weight: 700;
        font-family: "SF Mono", "Fira Code", monospace;
      }
      .git-status-M {
        color: #e2b93d;
      }
      .git-status-A {
        color: #73c991;
      }
      .git-status-D {
        color: #e06c75;
      }
      .git-status-R {
        color: #6796e6;
      }
      .git-status-U {
        color: #73c991;
      }
      .git-status-C {
        color: #6796e6;
      }

      /* History tab */
      .git-history {
        padding: 4px 0;
        overflow-y: auto;
        flex: 1;
      }
      .git-history-entry {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 12px;
        border-bottom: 1px solid var(--border);
      }
      .git-history-entry:hover {
        background: var(--bg-hover);
      }
      .git-history-hash {
        font-size: 10px;
        font-family: "SF Mono", "Fira Code", monospace;
        color: var(--accent);
      }
      .git-history-message {
        font-size: 12px;
        color: var(--fg);
      }
      .git-history-meta {
        font-size: 10px;
        color: var(--fg-dim);
      }

      /* Utility */
      .git-loading {
        padding: 8px;
        text-align: center;
        color: var(--fg-dim);
        font-size: 11px;
      }
      .git-error {
        padding: 6px 8px;
        font-size: 11px;
        color: #e06c75;
        background: rgba(224, 108, 117, 0.08);
        border-bottom: 1px solid var(--border);
      }
      .git-empty {
        padding: 16px 8px;
        text-align: center;
        color: var(--fg-dim);
        font-size: 12px;
      }

      .git-panel-empty {
        justify-content: center;
        align-items: center;
      }
      .git-empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px 16px;
        text-align: center;
        color: var(--fg-dim);
      }
      .git-empty-state p {
        margin: 0;
        font-size: 12px;
      }
      .git-sync-bar--no-remote {
        gap: 8px;
      }

      /* GitHub auth dialog */
      .github-auth-dialog {
        text-align: center;
        padding: 16px 0;
      }
      .github-auth-dialog p {
        margin: 8px 0;
        font-size: 13px;
      }
      .github-auth-code {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        font-family: var(--mono-font, monospace);
        padding: 12px 16px;
        background: var(--hover-bg);
        border-radius: var(--radius);
        display: inline-block;
        margin: 8px 0;
      }
      .github-auth-waiting {
        color: var(--fg-dim);
        font-style: italic;
      }

      /* GitHub publish dialog */
      .github-publish-dialog {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px 0;
      }
      .github-publish-dialog sp-textfield {
        width: 100%;
      }

      /* ─── Feature toggle (stylebook) ─────────────── */
      .tb-toggle {
        padding: 3px 8px;
        font: inherit;
        font-size: 11px;
        color: var(--fg-dim);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
      }
      .tb-toggle:hover {
        background: var(--hover-bg);
      }
      .tb-toggle.active {
        color: var(--accent);
        border-color: var(--accent);
        background: var(--accent-15);
      }

      /* ─── Stylebook ─────────────────────────────────── */
      .stylebook-style-header {
        padding: 6px 8px;
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        border-bottom: 1px solid var(--border);
        font-family: "SF Mono", "Fira Code", monospace;
      }

      /* Chrome bar (tabs + filter) above the canvas viewport */
      .sb-chrome {
        display: flex;
        align-items: center;
        padding: 4px 8px;
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border);
        gap: 4px;
        flex-shrink: 0;
      }

      /* Section layout in canvas */
      .sb-section {
        margin-bottom: 24px;
      }
      .sb-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--canvas-muted);
        padding: 8px 0 4px;
        border-bottom: 1px solid var(--canvas-rule);
        margin-bottom: 8px;
      }
      .sb-body {
        padding: 4px 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      /* Variable rows — unified layout for existing + add-new */
      .sb-var-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px 0;
        border-bottom: 1px solid var(--canvas-rule);
      }
      .sb-var-row:last-child {
        border-bottom: none;
      }
      .sb-var-row-header {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-height: 18px;
        flex-wrap: wrap;
      }
      .sb-var-row-title {
        font-weight: 600;
        font-size: 12px;
        color: var(--canvas-fg-2);
        white-space: nowrap;
      }
      .sb-var-row-ref {
        font-size: 10px;
        color: var(--canvas-muted);
        font-family: "SF Mono", "Fira Code", monospace;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sb-var-row-header .sb-var-del {
        margin-left: auto;
      }
      .sb-var-row sp-textfield {
        pointer-events: auto;
      }
      /* Existing variable: horizontal swatch + value */
      .sb-var-input-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .sb-var-col-name {
        min-width: 0;
      }
      .sb-var-col-value {
        flex: 1;
        min-width: 0;
      }
      .sb-var-col-name sp-textfield,
      .sb-var-col-value sp-textfield {
        width: 100%;
      }
      .sb-var-col-label {
        font-size: 10px;
        color: var(--canvas-dim);
        margin-bottom: 2px;
        font-weight: 500;
      }
      /* Add-new form: horizontal layout matching existing rows */
      .sb-var-row.is-new .sb-var-input-row {
        flex-wrap: nowrap;
        align-items: flex-end;
      }
      .sb-var-row.is-new .sb-var-col-name {
        flex: 2;
        min-width: 0;
      }
      .sb-var-row.is-new .sb-var-col-value {
        flex: 3;
        min-width: 0;
      }
      .sb-var-row.is-new .sb-var-swatch {
        align-self: flex-end;
        margin-bottom: 2px;
      }
      .sb-var-swatch {
        width: 28px;
        height: 28px;
        border-radius: 4px;
        border: 1px solid var(--canvas-border);
        cursor: pointer;
        position: relative;
        flex-shrink: 0;
        align-self: flex-end;
        margin-bottom: 2px;
      }
      .sb-var-swatch input[type="color"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
        pointer-events: auto;
      }
      .sb-var-preview {
        margin-top: 2px;
        padding: 8px;
        background: var(--canvas-bg-1);
        border-radius: 4px;
        border: 1px solid var(--canvas-rule);
      }
      .sb-var-font-preview {
        font-size: 14px;
        line-height: 1.4;
        color: var(--canvas-fg-2);
      }
      .sb-var-size-track {
        background: var(--canvas-track);
        height: 8px;
        border-radius: 4px;
        width: 100%;
        overflow: hidden;
      }
      .sb-var-size-bar {
        height: 100%;
        background: var(--accent, #007acc);
        transition: width 0.3s;
        border-radius: 4px;
      }
      .sb-var-del {
        opacity: 0;
        transition: opacity 0.15s;
        flex-shrink: 0;
      }
      .sb-var-row:hover .sb-var-del {
        opacity: 1;
      }
      .sb-var-empty {
        padding: 16px 8px;
        text-align: center;
        color: var(--canvas-light);
        font-size: 12px;
        font-style: italic;
      }
      .sb-var-add-btn {
        margin-top: 6px;
        pointer-events: auto;
        background: none;
        border: 1px dashed var(--canvas-border);
        border-radius: 4px;
        padding: 5px 10px;
        font-size: 12px;
        color: var(--canvas-fg-3);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
        transition: all 0.15s;
      }
      .sb-var-add-btn:hover {
        border-color: var(--canvas-muted);
        color: var(--canvas-fg-2);
        background: var(--canvas-bg-1);
      }
      .sb-var-add-icon {
        font-size: 14px;
        font-weight: 600;
      }
      .sb-var-add-actions {
        display: flex;
        gap: 4px;
        align-items: center;
        flex-shrink: 0;
        align-self: flex-end;
        margin-bottom: 2px;
      }
      .sb-unit-input {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
      }
      .sb-unit-input sp-textfield {
        width: 100%;
      }
      .sb-unit-input sp-picker {
        position: absolute;
        right: 2px;
        --mod-picker-border-width: 0;
        --mod-picker-min-width: 56px;
      }
      .sb-var-add-preview {
        font-size: 10px;
        color: var(--canvas-muted);
        font-family: "SF Mono", "Fira Code", monospace;
        min-height: 14px;
      }

      /* ─── Inline editing ─────────────────────────── */
      .canvas-panel-canvas [contenteditable="true"] {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        cursor: text;
        min-height: 1.5em;
        border-radius: 2px;
      }
      .canvas-panel-canvas [contenteditable="true"]:focus {
        outline-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-15);
      }

      /* ─── Welcome screen ─────────────────────────── */
      .welcome-screen {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 10vh;
        overflow-y: auto;
      }
      .welcome-content {
        max-width: 500px;
        width: 100%;
        padding: 0 24px;
      }
      .welcome-title {
        font-size: 28px;
        font-weight: 300;
        color: var(--fg);
        margin: 0;
        letter-spacing: -0.5px;
      }
      .welcome-subtitle {
        font-size: 14px;
        color: var(--fg-dim);
        margin: 2px 0 0;
      }
      .welcome-section {
        margin-top: 28px;
      }
      .welcome-section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--fg);
        margin: 0 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .welcome-action {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 5px 8px;
        margin: 0;
        background: none;
        border: none;
        border-radius: var(--radius);
        font: inherit;
        font-size: 13px;
        color: var(--accent);
        cursor: pointer;
        text-align: left;
      }
      .welcome-action:hover {
        background: var(--hover-bg);
        text-decoration: underline;
      }
      .welcome-action-icon {
        flex-shrink: 0;
        opacity: 0.8;
      }
      .welcome-recent {
        display: flex;
        align-items: baseline;
        gap: 12px;
        width: 100%;
        padding: 4px 8px;
        margin: 0;
        background: none;
        border: none;
        border-radius: var(--radius);
        font: inherit;
        font-size: 13px;
        color: var(--fg);
        cursor: pointer;
        text-align: left;
      }
      .welcome-recent:hover {
        background: var(--hover-bg);
      }
      .welcome-recent-name {
        color: var(--accent);
        flex-shrink: 0;
      }
      .welcome-recent-name:hover {
        text-decoration: underline;
      }
      .welcome-recent-path {
        color: var(--fg-dim);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <sp-theme color="dark" scale="medium" system="spectrum">
      <div id="app">
        <div id="toolbar"></div>
        <div id="tab-strip"></div>
        <div id="activity-bar"></div>
        <div id="left-panel"></div>
        <div id="resize-left" class="resize-handle"></div>
        <div id="canvas-wrap"></div>
        <div id="resize-right" class="resize-handle"></div>
        <div id="right-panel"></div>
        <div id="statusbar"></div>
      </div>
      <div
        id="layer-popover"
        style="position: fixed; inset: 0; pointer-events: none; z-index: 1000"
      ></div>
      <div
        id="layer-modal"
        style="position: fixed; inset: 0; pointer-events: none; z-index: 2000"
      ></div>
      <div
        id="layer-dialog"
        style="position: fixed; inset: 0; pointer-events: none; z-index: 3000"
      ></div>
    </sp-theme>
    <script type="module" src="./dist/studio.js"></script>
  </body>
</html>
