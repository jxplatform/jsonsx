<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jx Studio</title>
    <link rel="stylesheet" href="./dist/studio.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/shell.css" />
    <link rel="stylesheet" href="./styles/canvas.css" />
    <link rel="stylesheet" href="./styles/panels.css" />
    <link rel="stylesheet" href="./styles/inspector.css" />
    <link rel="stylesheet" href="./styles/overlays.css" />
  </head>
  <body>
    <sp-theme color="dark" scale="medium" system="spectrum">
      <div id="app">
        <div id="toolbar"></div>
        <div id="tab-strip"></div>
        <div id="tab-bar"></div>
        <div id="frontmatter-panel" hidden></div>
        <div id="activity-bar"></div>
        <div id="left-panel"></div>
        <div id="resize-left" class="resize-handle"></div>
        <div id="canvas-wrap"></div>
        <div id="resize-right" class="resize-handle"></div>
        <div id="right-panel"></div>
        <div id="resize-chat" class="resize-handle"></div>
        <div id="chat-panel"></div>
        <!-- The app's only status channel: announce what lands in it (spec §12 region ⑫). -->
        <div id="statusbar" role="status" aria-live="polite"></div>
      </div>
      <div
        id="layer-popover"
        style="position: fixed; inset: 0; pointer-events: none; z-index: 1000"
      ></div>
      <div
        id="layer-modal"
        style="position: fixed; inset: 0; pointer-events: none; z-index: 2000"
      ></div>
      <div
        id="layer-dialog"
        style="position: fixed; inset: 0; pointer-events: none; z-index: 3000"
      ></div>
    </sp-theme>
    <script type="module" src="./dist/studio.js"></script>
  </body>
</html>
