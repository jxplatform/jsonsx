<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jx Canvas</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #jx-canvas-root {
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="jx-canvas-root"></div>
    <!-- Dev: cache-bust so each iframe mount loads the freshest canvas bundle. -->

      import(`./dist/iframe-entry.js?t=${Date.now()}`);
    </script>
  </body>
</html>
