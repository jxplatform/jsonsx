[test]
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/tests/**",
  "./result/**",
  "../../extensions/**",
  "../create/**",
  "../desktop/**",
  "../markup/**",
  "../parser/**",
  "../runtime/**",
  "../schema/**",
  "../server/**",
  "../studio/**",
]
coverageThreshold = { lines = 0.86, functions = 0.91 }
