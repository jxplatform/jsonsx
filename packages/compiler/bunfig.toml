[test]
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/tests/**",
  "./result/**",
  # Transient /tmp modules some tests import (portability worker copy, importImplementation
  # fixtures) — loaded artifacts, not compiler source.
  "**/jx-worker-portability-*/**",
  "**/jx-import-impl-*/**",
  "../../extensions/**",
  "../create/**",
  "../desktop/**",
  "../markup/**",
  "../parser/**",
  "../runtime/**",
  "../schema/**",
  "../server/**",
  "../studio/**",
]
coverageThreshold = { lines = 0.96, functions = 0.98 }
