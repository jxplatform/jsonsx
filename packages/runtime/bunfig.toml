[test]
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/tests/**",
  "./result/**",
  # Parser moved under extensions/; it resolves at ../../extensions/parser now.
  "../../extensions/parser/**",
  "../compiler/**",
  "../create/**",
  "../desktop/**",
  "../markup/**",
  "../schema/**",
  "../server/**",
  "../studio/**",
]
coverageThreshold = { lines = 0.95, functions = 0.97 }
