[test]
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/tests/**",
  "./result/**",
  "../../extensions/**",
  "../collab/**",
  "../compiler/**",
  "../create/**",
  "../desktop/**",
  "../markup/**",
  "../parser/**",
  "../runtime/**",
  "../schema/**",
  "../studio/**",
]
coverageThreshold = { lines = 0.94, functions = 0.84 }
