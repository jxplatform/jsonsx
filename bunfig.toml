# Bun's default "isolated" linker (1.3+) mis-resolves package `exports` in this
# workspace — e.g. @vue/reactivity resolves to its CJS `index.js` (whose exports
# bun can't statically analyze) during the `--target=node` prepare builds, so
# `bun install` fails running workspace prepare scripts. The classic hoisted
# layout resolves correctly (and matches the Nix build). See oven-sh/bun#23615.
[install]
linker = "hoisted"

[test]
# `result` is the Nix build output symlink (-> /nix/store/...jx-studio). Without this, a root-level
# `bun test` follows it and runs the stale built copy's ~680 test files. `vendor` is the pinned
# Electrobun SDK submodule — a dependency's sources, whose suite is not ours to run. Neither is
# reachable from a per-package run (cwd inside each package), which is what CI does, so both of
# these only affect root-level runs.
pathIgnorePatterns = ["**/result/**", "**/vendor/**"]
coverageReporter = ["text"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "./commitlint.config.js",
  "./result/**",
  "**/dist/**",
  "**/tests/**",
  "**/tmp/**",
]
