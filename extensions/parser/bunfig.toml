[test]
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/tests/**",
  "./dist/*",
  "./result/**",
  # Cross-package workspace source pulled in via imports. Parser lives under
  # extensions/, so sibling packages resolve at ../../packages/* (not ../*).
  "../../packages/compiler/**",
  "../../packages/create/**",
  "../../packages/desktop/**",
  "../../packages/markup/**",
  "../../packages/runtime/**",
  "../../packages/schema/**",
  "../../packages/server/**",
  "../../packages/studio/**",
]
coverageThreshold = { lines = 0.87, functions = 0.88 }
