name: Build Desktop (Windows)

on:
  workflow_call:
    inputs:
      tag_name:
        description: Tag to build and attach artifacts to.
        required: true
        type: string

jobs:
  build:
    name: Build (windows-x64)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned; keep in sync with the canonical pin in test.yml.
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix
          wix eula accept wix7

      - name: Build workspace packages
        run: bun run build

      - name: Build desktop installer
        env:
          # build-msi.ts stamps the MSI update manifest (latest.json) with the
          # release download URL; feed it the actual desktop tag so it doesn't
          # reconstruct the old `v<version>` scheme.
          DESKTOP_RELEASE_TAG: ${{ inputs.tag_name }}
        run: bun run desktop:stable

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: packages/desktop/artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release
        # Run even when the build step failed, so any artifacts that DID land in
        # packages/desktop/artifacts/ still reach the release — notably the
        # Electrobun installer built before the flakier MSI/WiX step. action-gh-release
        # no-ops on an empty glob (fail_on_unmatched_files defaults false), so a
        # total build failure leaves the job red without adding a spurious error.
        if: ${{ !cancelled() }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          draft: false
          # Force the desktop release to be GitHub's "latest" so the Electrobun
          # updater's releases/latest/download/ feed resolves here. Idempotent
          # across the concurrent bundler attach jobs.
          make_latest: true
          files: packages/desktop/artifacts/*
