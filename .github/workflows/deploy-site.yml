name: Deploy jxsuite.com

on:
  push:
    branches: [main]
    # Only auto-deploy when the site's own files change. A schema/compiler/runtime
    # change that alters the rendered output won't trigger this — redeploy manually
    # via workflow_dispatch when a core-package change needs to reach the site.
    paths:
      - "sites/jxsuite.com/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run generate:schema

      - run: bun run build:parser

      - run: bun run build:compiler

      - run: bun run --cwd sites/jxsuite.com build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: sites/jxsuite.com/dist

      - id: deployment
        uses: actions/deploy-pages@v5
