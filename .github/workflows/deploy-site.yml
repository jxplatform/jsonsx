name: Deploy jxsuite.com

on:
  push:
    branches: [main]
    # Only auto-deploy when the site's own files change. A schema/compiler/runtime
    # change that alters the rendered output won't trigger this — redeploy manually
    # via workflow_dispatch when a core-package change needs to reach the site.
    paths:
      - "sites/jxsuite.com/**"
      - "docs/**"
      - "scripts/docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned; keep in sync with the canonical pin in test.yml.
          bun-version: 1.3.13

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      # The compiler's image cache is content-addressed (contentHash:configHash) and
      # self-invalidating, so this key only governs when a fresh snapshot is saved:
      # any deploy-triggering change produces a new key, while restore-keys restores
      # the most recent prior cache so only new/changed images get re-encoded.
      - uses: actions/cache@v6
        with:
          path: ~/.npm/jxsuite-images
          key: jxsuite-images-${{ hashFiles('sites/jxsuite.com/**', 'docs/**', 'scripts/docs/**') }}
          restore-keys: |
            jxsuite-images-

      - run: bun install

      # Gate the deploy on marketing-copy truthfulness before anything is built or published.
      - run: bun run docs:claims

      - run: bun run generate:schema

      - run: bun run build:parser

      - run: bun run build:compiler

      - run: bun run --cwd sites/jxsuite.com build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: sites/jxsuite.com/dist

      - id: deployment
        uses: actions/deploy-pages@v5
