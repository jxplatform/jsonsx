# jxsuite.com publishes the RELEASED tree, never the trunk, so the docs a visitor reads always
# describe the app they can actually download. That splits this workflow in two:
#
#   * `build` runs on pull requests and on `main`, and proves the site still compiles at the moment
#     someone breaks it rather than weeks later on release day. It publishes nothing.
#   * `deploy` runs only when a ref was handed in — i.e. from release-please.yml at the desktop tag
#     it just advanced `release` to, or from a deliberate manual dispatch.
#
# It has to be INVOKED rather than triggered. `advance-release-branch` moves `release` with a plain
# GITHUB_TOKEN push, and pushes made with that token do not start workflows — the same reason the
# publish and desktop-bundler jobs are `uses:` calls instead of `on: push: tags`. An
# `on: push: branches: [release]` trigger here would look right and simply never fire.
#
# The cost, accepted deliberately: a docs change on `main` reaches the site only when the desktop
# component next releases. `workflow_dispatch` with `ref: main` is the escape hatch.
name: Deploy jxsuite.com

on:
  # Build-only. Same paths as before — a schema/compiler/runtime change that alters the rendered
  # output won't trigger this, and doesn't need to, because nothing here publishes.
  pull_request:
    paths:
      - "sites/jxsuite.com/**"
      - "docs/**"
      - "scripts/docs/**"
  push:
    branches: [main]
    paths:
      - "sites/jxsuite.com/**"
      - "docs/**"
      - "scripts/docs/**"
  workflow_call:
    inputs:
      ref:
        description: "Tree to publish. The release pipeline passes the desktop tag it just shipped."
        required: false
        default: release
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Tree to publish. `release` is the last shipped tree; `main` publishes unreleased work."
        required: false
        default: release
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Every publish shares one group, so a newer release supersedes an older deploy. Build-only runs
  # are keyed per ref instead — otherwise a pull request would cancel a release's deploy.
  group: pages-${{ inputs.ref && 'publish' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # An empty `ref` is exactly what actions/checkout does by default (the triggering ref), so
      # this one line covers the release call and the pull request alike.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned; keep in sync with the canonical pin in test.yml.
          bun-version: 1.4

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      # The compiler's image cache is content-addressed (contentHash:configHash) and
      # self-invalidating, so this key only governs when a fresh snapshot is saved:
      # any deploy-triggering change produces a new key, while restore-keys restores
      # the most recent prior cache so only new/changed images get re-encoded.
      - uses: actions/cache@v6
        with:
          path: ~/.npm/jxsuite-images
          key: jxsuite-images-${{ hashFiles('sites/jxsuite.com/**', 'docs/**', 'scripts/docs/**') }}
          restore-keys: |
            jxsuite-images-

      - run: bun install

      # Gate the deploy on marketing-copy truthfulness before anything is built or published.
      - run: bun run docs:claims

      - run: bun run generate:schema

      - run: bun run build:parser

      - run: bun run build:compiler

      - run: bun run --cwd sites/jxsuite.com build

      - if: inputs.ref
        uses: actions/configure-pages@v6

      - if: inputs.ref
        uses: actions/upload-pages-artifact@v5
        with:
          path: sites/jxsuite.com/dist

  deploy:
    needs: build
    if: inputs.ref
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
