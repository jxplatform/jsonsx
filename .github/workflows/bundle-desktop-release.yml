name: Publish Desktop Release

on:
  workflow_run:
    workflows:
      - "Build Desktop (Linux)"
      - "Build Desktop (Windows)"
      - "Build Desktop (macOS)"
    types:
      - completed
    branches:
      - main

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    permissions:
      contents: write
      actions: read

    steps:
      - name: Get tag name
        id: tag
        run: echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

      - name: Wait for all platform builds
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.tag }}';
            const workflows = ['Build Desktop (Linux)', 'Build Desktop (Windows)', 'Build Desktop (macOS)'];
            const maxWait = 30 * 60 * 1000; // 30 minutes
            const pollInterval = 30 * 1000; // 30 seconds
            const start = Date.now();

            while (Date.now() - start < maxWait) {
              let allComplete = true;
              let anyFailed = false;

              for (const name of workflows) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: `bundle-desktop-${name.includes('Linux') ? 'linux' : name.includes('Windows') ? 'windows' : 'macos'}.yml`,
                  head_sha: context.payload.workflow_run.head_sha,
                });

                const run = runs.data.workflow_runs[0];
                if (!run || run.status !== 'completed') {
                  allComplete = false;
                } else if (run.conclusion !== 'success') {
                  anyFailed = true;
                }
              }

              if (anyFailed) {
                core.setFailed('One or more platform builds failed');
                return;
              }
              if (allComplete) {
                core.info('All platform builds completed successfully');
                return;
              }

              core.info('Waiting for all builds to complete...');
              await new Promise(r => setTimeout(r, pollInterval));
            }

            core.setFailed('Timed out waiting for builds');

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download artifacts from other workflows
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const workflows = ['bundle-desktop-linux.yml', 'bundle-desktop-windows.yml', 'bundle-desktop-macos.yml'];

            for (const wf of workflows) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf,
                head_sha: context.payload.workflow_run.head_sha,
              });

              const run = runs.data.workflow_runs[0];
              if (!run) continue;

              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });

              for (const artifact of artifacts.data.artifacts) {
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });

                fs.writeFileSync(`artifacts/${artifact.name}.zip`, Buffer.from(download.data));
              }
            }

      - name: Extract artifacts
        run: |
          cd artifacts
          for f in *.zip; do
            [ -f "$f" ] && unzip -o "$f" -d . && rm "$f"
          done

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: false
          files: artifacts/*
