name: Build Desktop (macOS)

on:
  workflow_call:
    inputs:
      tag_name:
        description: Tag to build and attach artifacts to.
        required: true
        type: string

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to macos-15 (arm64 GA image), NOT macos-latest. On 2026-06-15
          # `macos-latest` migrated to the macOS 26 beta image, where posix_spawn
          # of electrobun's ad-hoc/linker-signed arm64 CLI fails with ENOEXEC
          # (the Developer-ID-signed x64 CLI runs fine on macos-26-intel below).
          # Revisit once electrobun ships a properly-signed arm64 CLI or macOS 26 GA works.
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned; keep in sync with the canonical pin in test.yml.
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /Developer/MonoTouch
          sudo rm -rf /Library/Frameworks/Mono.framework
          sudo rm -rf /Library/Frameworks/Xamarin.iOS.framework
          sudo rm -rf /Library/Frameworks/Xamarin.Mac.framework
          sudo rm -rf /opt/homebrew/Cellar || true
          sudo rm -rf /opt/homebrew/lib/node_modules || true
          sudo rm -rf /Users/runner/.dotnet || true
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /Users/runner/Library/Caches/Homebrew || true
          sudo rm -rf /usr/local/Cellar || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/powershell || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Build workspace packages
        run: bun run build

      - name: Import code signing certificate
        if: env.CERTIFICATE_BASE64 != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm $RUNNER_TEMP/certificate.p12

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Write Apple API Key File
        if: env.APPLE_API_KEY_BASE64 != ''
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.apple/keys
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > ~/.apple/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Build desktop installer
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
          ELECTROBUN_APPLEAPIKEYPATH: /Users/runner/.apple/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.APPLE_API_KEY_ID }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bun run desktop:stable

      - name: Clean up signing materials
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/.apple/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: packages/desktop/artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release
        # Run even when the build step failed, so any artifacts that DID land in
        # packages/desktop/artifacts/ still reach the release. action-gh-release
        # no-ops on an empty glob (fail_on_unmatched_files defaults false), so a
        # total build failure leaves the job red without adding a spurious error.
        if: ${{ !cancelled() }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          draft: false
          # Force the desktop release to be GitHub's "latest" so the Electrobun
          # updater's releases/latest/download/ feed resolves here. Idempotent
          # across the concurrent bundler attach jobs.
          make_latest: true
          files: packages/desktop/artifacts/*
