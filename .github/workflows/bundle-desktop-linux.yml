name: Build Desktop (Linux)

on:
  workflow_call:
    inputs:
      tag_name:
        description: Tag to build and attach artifacts to.
        required: true
        type: string

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          # Electrobun 2 publishes a linux-arm64 core archive, which 1.18 did not. Hutch builds for
          # the host only, so this needs a native arm64 runner rather than a cross-compile flag.
          - os: ubuntu-24.04-arm
            platform: linux-arm64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned; keep in sync with the canonical pin in test.yml.
          bun-version: 1.4

      - name: Install dependencies
        run: bun install

      # Electrobun 2 builds through Hutch, which the `electrobun` devDependency downloads and
      # verifies on first use — no machine-wide install. The build prepares the SDK implicitly; this
      # only warms the shared store so every lane is not re-downloading the core and CEF.
      - name: Prepare Electrobun
        uses: ./.github/actions/prepare-electrobun
        with:
          sync: "false"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            build-essential \
            cmake \
            pkg-config

      - name: Build workspace packages
        run: bun run build

      - name: Build desktop installer
        run: bun run desktop:stable

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: packages/desktop/artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release
        # Run even when the build step failed, so any artifacts that DID land in
        # packages/desktop/artifacts/ still reach the release. action-gh-release
        # no-ops on an empty glob (fail_on_unmatched_files defaults false), so a
        # total build failure leaves the job red without adding a spurious error.
        if: ${{ !cancelled() }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          draft: false
          # Force the desktop release to be GitHub's "latest" so the Electrobun
          # updater's releases/latest/download/ feed resolves here. Idempotent
          # across the concurrent bundler attach jobs.
          make_latest: true
          files: packages/desktop/artifacts/*
