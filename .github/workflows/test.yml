name: Test
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - compiler
          - create
          - desktop
          - parser
          - runtime
          - schema
          - server
          - studio
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: coverage instrumentation shifts between Bun versions and
          # would silently move the coverageThreshold ratchet. Bump this
          # together with re-baselining packages/*/bunfig.toml thresholds.
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Test with coverage
        shell: bash
        run: |
          set -o pipefail
          bun test --isolate --coverage 2>&1 | tee /tmp/test-output.txt
        working-directory: packages/${{ matrix.package }}
      - run: bun scripts/check-coverage-manifest.ts packages/${{ matrix.package }}
      - name: Extract coverage report
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/coverage-report
          # The coverage table is delimited by three dashed lines:
          # dashes / header / dashes / rows / dashes.
          awk '/^-+\|/ { n++; print; if (n == 3) exit; next } n >= 1' /tmp/test-output.txt \
            > /tmp/coverage-report/${{ matrix.package }}.txt
          tests=$(grep -E '^ [0-9]+ (pass|fail)' /tmp/test-output.txt | sed 's/^ *//' | awk '{printf "%s%s", sep, $0; sep=", "}')
          all=$(grep '^All files' /tmp/coverage-report/${{ matrix.package }}.txt || echo 'no coverage data')
          {
            echo "### \`${{ matrix.package }}\` coverage"
            echo ""
            echo "\`$all\` — $tests"
            echo ""
            echo "<details><summary>Per-file coverage</summary>"
            echo ""
            echo '```'
            cat /tmp/coverage-report/${{ matrix.package }}.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package }}
          path: /tmp/coverage-report/${{ matrix.package }}.txt
          retention-days: 7

  coverage-comment:
    # Sticky PR comment with all packages' coverage tables. Skipped for fork
    # PRs, where GITHUB_TOKEN is read-only.
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: true
      - name: Build comment body
        shell: bash
        run: |
          {
            echo "<!-- coverage-report -->"
            echo "## Test coverage"
            echo ""
            echo "| Package | % Funcs | % Lines |"
            echo "|---|---|---|"
            for f in coverage-reports/*.txt; do
              pkg=$(basename "$f" .txt)
              row=$(grep '^All files' "$f" || true)
              funcs=$(echo "$row" | awk -F'|' '{gsub(/ /,"",$2); print $2}')
              lines=$(echo "$row" | awk -F'|' '{gsub(/ /,"",$3); print $3}')
              echo "| $pkg | ${funcs:-—} | ${lines:-—} |"
            done
            echo ""
            for f in coverage-reports/*.txt; do
              pkg=$(basename "$f" .txt)
              echo "<details><summary><code>$pkg</code> per-file coverage</summary>"
              echo ""
              echo '```'
              cat "$f"
              echo '```'
              echo ""
              echo "</details>"
            done
          } > comment-body.md
      - name: Upsert sticky comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment-body.md', 'utf8');
            const marker = '<!-- coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
