name: Test
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

# A PR branch that gets three pushes in a minute used to leave three full ~22-job fan-outs
# racing each other; only the last one's answer was ever read. On main, never cancel:
# release-please and the Codecov per-flag baselines need every main commit to produce a
# complete report.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which of the jobs below this diff can actually fail. See scripts/ci/affected.ts for the rules
  # and for why only four things here are gated at all.
  #
  # This workflow must NEVER grow an `on:`-level `paths:` filter. A path-filtered workflow that
  # does not trigger leaves a required status check pending forever; the `ci` job at the bottom is
  # the one stable name to protect, and it can only report if the workflow always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.affected.outputs.test_matrix }}
      has_tests: ${{ steps.affected.outputs.has_tests }}
      all_workspaces: ${{ steps.affected.outputs.all_workspaces }}
      lens_mutants: ${{ steps.affected.outputs.gate_lens_mutants }}
      nix: ${{ steps.affected.outputs.gate_nix }}
      mode: ${{ steps.affected.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate diffs against the merge base. `blob:none` keeps history and trees local —
          # so merge-base and --name-only run offline — while deferring file content nobody here
          # reads. A full clone of this 551 MB pack is 28s; this is ~4s.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-bun
      # The gate proves itself before it gates. This also gives scripts/*.test.ts its only home in
      # CI: scripts/ is not a coverage workspace and the matrix below only runs `bun test` with
      # cwd INSIDE a workspace, so these five files previously ran nowhere.
      - run: bun test --isolate scripts
      - id: affected
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: bun scripts/ci/affected.ts

  test:
    needs: changes
    # A `strategy.matrix` built from an empty include is a workflow ERROR, not a skipped job.
    if: needs.changes.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    # The slowest workspace in this matrix is studio at ~6 minutes; every other one is under a
    # minute. The cap is not a performance budget, it is a liveness one: on 19 Aug the compiler
    # job — a 40-second job — sat inside `bun test` for over an hour, and with GitHub's 360-minute
    # default it would have held the `ci` required check pending for six. A hung runner should
    # report a red X while someone is still looking at the PR.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # dir = workspace path (packages/* core, extensions/* extensions);
      # flag = codecov flag / artifact name (flags cannot contain "/").
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.test_matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Test with coverage
        shell: bash
        run: |
          set -o pipefail
          status=0
          bun test --isolate --coverage \
            --reporter=junit --reporter-outfile=junit.xml \
            2>&1 | tee /tmp/test-output.txt || status=$?
          # An exit status above 128 is a SIGNAL: the test RUNNER died, and the counts above it
          # are the files that happened to finish first, not a verdict on the suite. Bun has
          # trapped this way on main three times since 14 Aug (133 = SIGTRAP, ~10s in, studio,
          # never with a failing test and never on a diff that touched it) — and the only trace
          # it leaves is one shell line buried mid-log, so the job reads exactly like a broken
          # test. Say which it was, here, where the failure is annotated.
          if [ "$status" -gt 128 ]; then
            echo "::error::bun test was killed by signal $((status - 128)) (exit $status) in ${{ matrix.package.dir }} — the runner crashed partway through, so no test reported this. Treat the counts above as a partial run, not a result."
          fi
          exit "$status"
        working-directory: ${{ matrix.package.dir }}
      - run: bun scripts/check-coverage-manifest.ts ${{ matrix.package.dir }}
      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jxsuite/jx
          files: ${{ matrix.package.dir }}/coverage/lcov.info
          flags: ${{ matrix.package.flag }}
      - name: Upload test results to Codecov
        # Test Analytics: Bun's JUnit reporter (written above) feeds Codecov's
        # flaky-test / failure tracking. Runs even when tests fail so failures
        # are recorded — only skipped if the job is cancelled.
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jxsuite/jx
          files: ${{ matrix.package.dir }}/junit.xml
          flags: ${{ matrix.package.flag }}
      - name: Extract coverage report
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/coverage-report
          # The coverage table is delimited by three dashed lines:
          # dashes / header / dashes / rows / dashes.
          awk '/^-+\|/ { n++; print; if (n == 3) exit; next } n >= 1' /tmp/test-output.txt \
            > /tmp/coverage-report/${{ matrix.package.flag }}.txt
          # `|| true`, because this step runs `if: always()` and a run that DIED has no summary
          # line to grep: under `bash -e -o pipefail` the empty grep failed the assignment, so a
          # crashed suite painted a second red X on a diagnostics step and buried the first.
          tests=$(grep -E '^ [0-9]+ (pass|fail)' /tmp/test-output.txt | sed 's/^ *//' | awk '{printf "%s%s", sep, $0; sep=", "}' || true)
          tests=${tests:-'no test summary — the run did not finish'}
          all=$(grep '^All files' /tmp/coverage-report/${{ matrix.package.flag }}.txt || echo 'no coverage data')
          {
            echo "### \`${{ matrix.package.flag }}\` coverage"
            echo ""
            echo "\`$all\` — $tests"
            echo ""
            echo "<details><summary>Per-file coverage</summary>"
            echo ""
            echo '```'
            cat /tmp/coverage-report/${{ matrix.package.flag }}.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package.flag }}
          path: /tmp/coverage-report/${{ matrix.package.flag }}.txt
          retention-days: 7

  coverage-comment:
    # Sticky PR comment with all packages' coverage tables. Skipped for fork
    # PRs, where GITHUB_TOKEN is read-only, and for a diff that reaches no
    # workspace at all — a docs PR does not need an all-empty coverage table.
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.has_tests == 'true'
    needs: [changes, test]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: true
      - name: Build comment body
        shell: bash
        env:
          # Every workspace, not just the ones that ran. A table that silently shrinks to the
          # affected packages reads as coverage having vanished; each skipped row says why
          # instead. Codecov's own flags carry forward (codecov.yml) for the same reason.
          ALL_WORKSPACES: ${{ needs.changes.outputs.all_workspaces }}
        run: |
          # jq, not bun: this job never installs Bun, it only downloads artifacts.
          mapfile -t all < <(echo "$ALL_WORKSPACES" | jq -r '.[]')
          ran=0
          for pkg in "${all[@]}"; do
            [ -f "coverage-reports/$pkg.txt" ] && ran=$((ran + 1))
          done
          {
            echo "<!-- coverage-report -->"
            echo "## Test coverage"
            echo ""
            echo "$ran of ${#all[@]} workspaces ran; the rest are unreachable from this diff."
            echo ""
            echo "| Package | % Funcs | % Lines |"
            echo "|---|---|---|"
            for pkg in "${all[@]}"; do
              f="coverage-reports/$pkg.txt"
              if [ ! -f "$f" ]; then
                echo "| $pkg | — | not affected |"
                continue
              fi
              row=$(grep '^All files' "$f" || true)
              funcs=$(echo "$row" | awk -F'|' '{gsub(/ /,"",$2); print $2}')
              lines=$(echo "$row" | awk -F'|' '{gsub(/ /,"",$3); print $3}')
              echo "| $pkg | ${funcs:-—} | ${lines:-—} |"
            done
            echo ""
            for f in coverage-reports/*.txt; do
              pkg=$(basename "$f" .txt)
              echo "<details><summary><code>$pkg</code> per-file coverage</summary>"
              echo ""
              echo '```'
              cat "$f"
              echo '```'
              echo ""
              echo "</details>"
            done
          } > comment-body.md
      - name: Upsert sticky comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment-body.md', 'utf8');
            const marker = '<!-- coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Deliberately UNGATED, and deliberately one job. Measured on green run 31489926926, every
  # check below is 0-4s and all of them together are 22s, while a fresh job costs ~15s just to
  # provision — so splitting these by concern, or gating them, would cost more time than it saves.
  # The two expensive things that used to live here have moved: the 28s full clone is now blobless,
  # and the 87s mutation gate is its own job below.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The spec release gate diffs against the merge base with main; a shallow
          # clone has no merge base and the gate would silently pass.
          fetch-depth: 0
          # …but a full clone of a 551 MB pack costs 28s, which was the single largest
          # step in this job. `blob:none` keeps all commits and all trees local — so
          # `git merge-base` and `git diff --name-only` still run offline — and defers
          # only file CONTENT, of which the gate reads a handful of changed spec .md.
          filter: blob:none
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      # Core packages must never depend on extension packages — see
      # specs/extensions.md §2 and scripts/check-dep-rules.ts.
      - run: bun scripts/check-dep-rules.ts
      # A project root that ships its own @jxsuite/* copy, or keeps a link to one that moved,
      # resolves past this workspace. Run BARE, and EARLY: `schema:verify` below runs
      # `schema:generate-all`, whose first step is this same script with `--fix`. Anywhere after
      # that a shadow is already gone and this step is a tautology — which is how the condition
      # went six weeks unreported the first time.
      - run: bun scripts/check-shadowed-core.ts
      # Template dependency ranges: every @jxsuite range that SHIPS inside a template — every
      # published starter manifest and create's scaffold map — must name the version that package
      # actually released. release-please rewrites them inside the release commit (extra-files), so
      # this is green on the release PR's first run; it fires when a template gains a dependency or
      # an extra-files entry is dropped. `bun run templates:sync` fixes it.
      - run: bun run templates:check
      # Studio commands: every declared `menus` placement must admit the command's
      # containment level (the level × placement matrix — UX-REDESIGN-PLAN §5.1,
      # normative copy in specs/studio-ui-guidelines.md §12).
      - run: bun scripts/check-command-levels.ts
      # Studio chrome is capped: ≤5 commands in the Command Bar's primary cluster,
      # ≤4 tabs per dock. See UX-REDESIGN-PLAN §2, principle 9.
      - run: bun scripts/check-chrome-budget.ts
      # Screenshot manifest — Lane 1 of the gate (UX-REDESIGN-PLAN §13.5). No browser,
      # seconds: every shot step must name a declared, scriptable command with valid
      # args, no `toggle*` id, and no CSS/XPath selector beyond the committed budget.
      # `docs:verify` below checks only that referenced images EXIST; this is the check
      # that turns a panel or command rename into a red X in the PR that caused it.
      - run: bun scripts/check-shot-contract.ts
      # The pane grid's two singleton rules (UX-REDESIGN-PLAN §18): per-stage state must live on
      # `CanvasSurface`, and a module that draws into a stage must key its instance by pane id.
      # Neither is expressible in the type system — `ViewState` has an index signature and a
      # module-level `let active` is well-typed — so the guard is a ratcheting allow-list.
      - run: bun --cwd packages/studio scripts/check-pane-singletons.ts
      # The template layer's two rules: a Spectrum control binds the state it moves ITSELF as a
      # live property (an attribute binding is dirty-checked away exactly when it mattered), and a
      # module holds its own rendered nodes with ref() rather than re-finding them by selector.
      # Both carry a ratcheting backlog; source-only, about a second.
      - run: bun --cwd packages/studio scripts/check-lit-conventions.ts
      # What the package promises about itself: the stylesheet list IS the stylesheets (a sheet the
      # list omits is one no document links — the 2.1.0 dead-links outage), `files` covers every
      # manifest path and every import that escapes src/, the abstraction declares no backend
      # package, and node: stays confined to the stager. Source-only, about a second.
      - run: bun --cwd packages/studio scripts/check-studio-package.ts
      - run: bun --cwd packages/studio scripts/check-icons.ts
      - run: bun run typecheck
      # packages/desktop is EXCLUDED from the root tsconfig (electrobun ships raw .ts in its dist,
      # which the root's two strictest flags reject 165 times) so it needs its own pass — without
      # this, nothing there is typechecked at all, and an unbound identifier once shipped through.
      # See packages/desktop/tsconfig.json for what differs and why.
      - run: bun run --cwd packages/desktop typecheck
      # Type-aware (tsgolint) pass — Flow-soundness rules in .oxlintrc.strict.json.
      # The tsgolint binary ships with the oxlint-tsgolint dev dep (installed above).
      - run: bun run lint:typecheck
      # Docs: generated reference pages must match their sources (diff gate), and
      # /docs frontmatter ↔ specs/code/screenshots/nav must agree.
      - run: bun run docs:verify
      # Marketing copy + README: no unbacked claims, dead download links, or wrong
      # starter counts; LICENSE files present. See scripts/docs/check-site-claims.ts.
      - run: bun run docs:claims
      # Specs: every file has a header, every status uses the canonical vocabulary,
      # footer versions match, and each spec's changelog agrees with its header.
      # See scripts/docs/check-spec-status.ts.
      - run: bun run docs:status
      # Markdown: no visual-editor escapes (`## 18\.`, `RESERVED\_KEYS`). One of these once made
      # spec.md's whole Standards Alignment section unfindable, so twelve rows silently stopped
      # being validated. See scripts/normalize-markdown.ts; `bun run format:md` fixes it.
      - run: bun run docs:markdown
      # Standards: every spec's `## N. Standards Alignment` table cites a known standard at its
      # canonical URL, binds a real numbered section, backs a present-tense claim with committed
      # evidence, and joins its Pending rows to sections the status markers agree are unbuilt.
      # See scripts/docs/check-standards.ts and specs/standards.md.
      - run: bun run docs:standards
      # Specs: a spec whose body changed must also be released — version advanced,
      # **Updated:** restamped, and a new changelog entry (`bun run spec:bump`).
      # See scripts/docs/check-spec-release.ts.
      - run: bun run docs:spec-release --base origin/${{ github.event.repository.default_branch }}
      # Jx schema compliance: every project root (examples, sites, starters, screenshot
      # fixtures) validates end-to-end — project.json, documents, classes, fragments, and
      # self-contained committed entry docs. See scripts/validate-schemas.ts.
      - run: bun run schema:validate-all
      # …and every committed schema is what its own generator produces — all seven core artifacts
      # and all 52 per-project entry documents. `schema:validate-all` checks that DOCUMENTS satisfy
      # the committed schemas; it cannot see a committed schema that has fallen behind its
      # generator. That gap hid two separate faults for six weeks: 40 CSS properties un-propagated
      # from the core, and one starter whose entry document was composed against a published
      # @jxsuite/schema left in a stray node_modules, so it was NARROWER than its own content
      # required.
      #
      # This used to be a shell one-liner whose two `git diff` pathspecs were each narrower than the
      # generator they followed — it regenerated all seven core artifacts and looked at ONE, so a
      # stale `class-schema.json`, `project-schema.json` or `schemas/*.schema.json` passed. It is
      # now scripts/check-schema-freshness.ts, which derives the file set from the tree and reports
      # drift as the JSON Pointers that moved rather than as 500 KB of diff.
      #
      # It stays a hard red X even though .github/workflows/schemas.yml backfills the same drift
      # automatically: that lane cannot push to a fork, and a required check is what keeps a stale
      # schema off `main` when it cannot.
      - run: bun run schema:verify
      # Changelog safety: a commit SUBJECT (or BREAKING CHANGE note) carrying a raw `<tag>` makes
      # release-please DROP that package from its own release — silently, exit 0. That is how
      # `schema` and `starters` fell out of three consecutive releases and `npm i @jxsuite/create`
      # became unresolvable. `.husky/commit-msg` runs the same rule, but a hook is skippable with
      # `--no-verify`, which is how the offending subject reached main. See commitlint.config.js.
      #
      # Pull-request-only, and it names the two shas explicitly rather than using HEAD: `checks`
      # runs on the merge commit, whose own subject is not a conventional commit.
      - name: Commit subjects must be changelog-safe
        if: github.event_name == 'pull_request'
        run: |
          bun scripts/check-changelog-safety.ts \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }}

  # Its own job because it is 87 of the 159 seconds `checks` used to take, and everything else
  # in there is 0-4s. It is gated on studio's OWN tree — not on studio merely being retested —
  # because the mutation targets are files under packages/studio/src and the assertions are
  # studio's own test files. Gating on the test set would fire this on most PRs in the repo,
  # since studio sits downstream of nearly everything. See scripts/ci/affected.ts.
  #
  # The derived pane's lens/companion discriminators (§18.4), each mutated in turn against the
  # ONE test file expected to notice. Two review rounds of that workstream each fixed the
  # defects they named and left as many behind, because a green suite says nothing about
  # whether it could tell right from wrong — a measurement found seven discriminators whose
  # inversion the whole 8000-test suite passed. A surviving mutant is red here, in the PR that
  # removed the assertion, naming the behaviour that is now unprotected.
  lens-mutants:
    needs: changes
    if: needs.changes.outputs.lens_mutants == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun --cwd packages/studio scripts/check-lens-mutants.ts

  # The Nix build, as a job of THIS workflow rather than a workflow of its own.
  #
  # It used to be `on: pull_request` in nix.yml with a `paths:` filter, and that is exactly why it
  # could never be required: a path-filtered workflow that does not fire leaves a required status
  # check pending forever — the same trap the `ci` job below is written to avoid. Moving the
  # pull-request leg here puts it behind a gate that always runs and always reports, so `nix / build`
  # becomes part of the one `ci` aggregate branch protection names.
  #
  # That matters most for the thing that motivated it: a dependency bump auto-merges on a green
  # `ci`, and the Nix package is the ONLY consumer of bun.nix and the flake inputs. Without this,
  # a bump that breaks packaging would land on main and first be noticed by a release refusing to
  # advance. The gate is scripts/ci/affected.ts's NIX_INPUTS.
  nix:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    # No `with:` — the defaults are the pull-request shape (ubuntu-latest, the checked-out ref, no
    # publish). No `secrets:` either: CACHIX_AUTH_TOKEN is only needed on the release leg, and a
    # pull request must not be able to write to the public cache.
    uses: ./.github/workflows/nix.yml

  # The ONE stable name to make a required status check on `main`. It lives in a workflow with no
  # `paths:` filter, so it always runs and always reports — a required check on a path-filtered
  # workflow hangs pending forever instead.
  #
  # It tests for failure/cancelled rather than requiring success, because `skipped` is the POINT
  # of this design: a job the diff cannot reach must leave this green.
  ci:
    if: always()
    needs: [changes, test, checks, lens-mutants, nix, coverage-comment]
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          MODE: ${{ needs.changes.outputs.mode }}
        run: |
          echo "scope: $MODE — job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::a required job reported '$result'"
              exit 1
            fi
          done
