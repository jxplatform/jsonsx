name: Bundle Analysis

# Codecov has no Bun-native bundler plugin, so we build each bundle with
# `bun build --metafile` and convert that metafile into Codecov's v3 bundle
# analysis payload via `metafile-codecov-bundle`, uploaded tokenlessly with
# GitHub Actions OIDC (hence `id-token: write`).
permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
  pull_request:
    # The DEPENDENCY closure of the three bundles below — a bundle of X is rebuilt when X or
    # anything X imports changes, which is the opposite direction from which test suites must be
    # rerun. A `paths:` filter at this level costs nothing (no gate job to provision), and this is
    # the whole reason a PR bumping an action version no longer gets told its bundle grew 16.2MB.
    #
    # GENERATED, and guarded: scripts/ci/bundle-paths.test.ts asserts this list is exactly what
    # `dependencyClosure` produces for compiler, runtime and studio. Add a dependency to any of
    # them and forget this file, and that test goes red naming both sides.
    paths:
      - "packages/ai/**"
      - "packages/collab/**"
      - "packages/compiler/**"
      - "packages/create/**"
      - "packages/formulas/**"
      - "packages/markup/**"
      - "packages/protocol/**"
      - "packages/runtime/**"
      - "packages/schema/**"
      - "packages/starters/**"
      - "packages/studio/**"
      # The lockfile moves what any of them actually bundles.
      - "bun.lock"
      - ".github/workflows/bundle-analysis.yml"

# Same rule as test.yml: supersede a PR's in-flight run, never main's (the Codecov bundle
# baseline is per-commit).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle-analysis:
    # Fork PRs get a read-only token with no OIDC, so the upload can't run.
    # Skip them entirely (same guard as the coverage-comment job in test.yml).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - compiler
          - runtime
          - studio
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with test.yml: bundle sizes shift between Bun
          # versions, which would move the Codecov baseline.
          bun-version: 1.4
      - run: bun install --frozen-lockfile
      - name: Build with metafile
        run: bun run build:metafile
        working-directory: packages/${{ matrix.package }}
      # The budget check is NOT here any more. It used to run on this lane and measure the wrong
      # artifact: `build:metafile` is a single unsplit `bun build` that inlines Monaco, so the
      # studio.js it produced was about 14.5 MB while the studio.js the release build writes — at
      # the same path, until now — is 2.9 MB. A ceiling set from one is meaningless for the other.
      # It runs in test.yml's `studio-dist` job, after a real `bun run build`, where it can also be
      # part of the `ci` aggregate. This lane writes to dist-metafile/ so the two no longer collide.
      - name: Upload bundle stats to Codecov
        run: >-
          bunx metafile-codecov
          -f metafile.json
          -n ${{ matrix.package }}
          --output-dir dist-metafile
          --bundler-name bun
          --bundler-version "$(bun --version)"
          --upload
        working-directory: packages/${{ matrix.package }}
