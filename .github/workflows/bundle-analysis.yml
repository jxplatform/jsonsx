name: Bundle Analysis

# Codecov has no Bun-native bundler plugin, so we build each bundle with
# `bun build --metafile` and convert that metafile into Codecov's v3 bundle
# analysis payload via `metafile-codecov-bundle`, uploaded tokenlessly with
# GitHub Actions OIDC (hence `id-token: write`).
permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  bundle-analysis:
    # Fork PRs get a read-only token with no OIDC, so the upload can't run.
    # Skip them entirely (same guard as the coverage-comment job in test.yml).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - compiler
          - parser
          - runtime
          - studio
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with test.yml: bundle sizes shift between Bun
          # versions, which would move the Codecov baseline.
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Build with metafile
        run: bun run build:metafile
        working-directory: packages/${{ matrix.package }}
      # TEMPORARY DEBUG: replaces `bunx metafile-codecov --upload` with an
      # inline reimplementation of the tool's upload path that PRINTS Codecov's
      # POST response (status/headers/body) and the exact service params it
      # sends. The upstream CLI discards that response, so the reason main-branch
      # bundle reports come back empty is invisible in normal logs. Revert this
      # step to the `bunx metafile-codecov ... --upload` one-liner once diagnosed.
      - name: Upload bundle stats to Codecov (instrumented debug)
        working-directory: packages/${{ matrix.package }}
        env:
          BUNDLE_NAME: ${{ matrix.package }}
        run: |
          cat > codecov-debug.mjs <<'JS'
          import { readFileSync } from "node:fs";
          import { transformMetafile, getServiceParams, fetchOidcToken } from "metafile-codecov-bundle";
          const NAME = process.env.BUNDLE_NAME;
          const banner = (s) => console.error(`\n===== [bundle-debug:${NAME}] ${s} =====`);
          const meta = JSON.parse(readFileSync("metafile.json", "utf8"));
          const payload = transformMetafile(meta, {
            bundleName: NAME,
            outputDir: "dist",
            bundler: { name: "bun", version: Bun.version },
          });
          const totalBytes = payload.assets.reduce((n, a) => n + a.size, 0);
          banner(`payload: bundleName=${payload.bundleName} assets=${payload.assets.length} chunks=${payload.chunks.length} totalBytes=${totalBytes}`);
          const params = getServiceParams();
          banner("SERVICE PARAMS sent to Codecov (branch/commit/pr are the key fields)");
          console.error("GITHUB_EVENT_NAME =", process.env.GITHUB_EVENT_NAME);
          console.error(JSON.stringify(params, null, 2));
          const oidc = await fetchOidcToken();
          banner(`OIDC token acquired (length ${oidc.length})`);
          const res = await fetch("https://api.codecov.io/upload/bundle_analysis/v1", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `token ${oidc}` },
            body: JSON.stringify(params),
          });
          const body = await res.text();
          banner(`CODECOV POST -> ${res.status} ${res.statusText}`);
          console.error("response headers:", JSON.stringify(Object.fromEntries(res.headers), null, 2));
          console.error("response body:", body);
          let putUrl;
          try { putUrl = JSON.parse(body).url; } catch {}
          if (!putUrl) { banner("NO presigned url in response body -- stopping before PUT"); process.exit(1); }
          const put = await fetch(putUrl, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const putBody = await put.text();
          banner(`STORAGE PUT -> ${put.status} ${put.statusText}`);
          if (putBody) console.error("PUT body (first 500 chars):", putBody.slice(0, 500));
          banner("done");
          JS
          bun codecov-debug.mjs
