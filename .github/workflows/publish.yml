name: Publish to npm
permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      paths_released:
        description: JSON array of package paths release-please released this run.
        required: true
        type: string
      sha:
        description: Release commit (all component tags point here).
        required: false
        type: string
        default: ""
  # Manual entry point for backfilling a publish that release-please released but
  # never pushed to npm (e.g. a package missing from the old hardcoded allowlist).
  # Point `sha` at the release commit so package.json carries the released versions;
  # the step is idempotent, so already-published packages are skipped.
  workflow_dispatch:
    inputs:
      paths_released:
        description: 'JSON array of package paths to publish, e.g. ["packages/collab","packages/protocol"].'
        required: true
        type: string
      sha:
        description: Commit or tag to check out and publish from (defaults to the branch head).
        required: false
        type: string
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: bun install
      - run: bun run build
      - name: Publish released packages (topological, idempotent)
        env:
          PATHS_RELEASED: ${{ inputs.paths_released }}
        run: |
          set -euo pipefail
          # The publish set is derived from the released paths (not a hand-maintained
          # list): scripts/publish-order.ts emits the package dirs to publish this run —
          # those release-please released AND that are npm-publishable (not `private`,
          # with a `publishConfig`; `desktop` ships as installers and is excluded because
          # it has none) — in topological order so deps publish before dependents. The old
          # hardcoded array silently dropped newly-added packages (protocol, collab).
          order_out="$(bun scripts/publish-order.ts)"
          mapfile -t order < <(printf '%s' "$order_out")
          if [ "${#order[@]}" -eq 0 ]; then
            echo "No npm packages released this run; nothing to publish."
            exit 0
          fi
          # publish-order.ts emits full repo-relative workspace paths
          # (packages/* and extensions/*).
          for pkg in "${order[@]}"; do
            name="$(node -p "require('./$pkg/package.json').name")"
            ver="$(node -p "require('./$pkg/package.json').version")"
            echo "::group::$pkg -> $name@$ver"
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "already published, skipping"
            else
              ( cd "$pkg" && bun pm pack && npm publish --provenance *.tgz )
            fi
            echo "::endgroup::"
          done
