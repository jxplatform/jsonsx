name: Build Windows Store Package (MSIX)

on:
  workflow_call:
    inputs:
      tag_name:
        description: Tag to build and attach the MSIX to.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to build/attach (leave blank to build the default branch without attaching).
        required: false
        type: string
        default: ""

jobs:
  build-msix:
    name: Build MSIX
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned; keep in sync with the canonical pin in test.yml.
          bun-version: 1.4

      - name: Install dependencies
        run: bun install

      # Electrobun 2 builds through Hutch, which the `electrobun` devDependency downloads and
      # verifies on first use — no machine-wide install. The build prepares the SDK implicitly; this
      # only warms the shared store so every lane is not re-downloading the core and CEF.
      - name: Cache the Hutch store
        uses: ./.github/actions/cache-hutch-store

      - name: Install Windows SDK
        uses: ChristopheLav/windows-sdk-install@v1
        with:
          version-sdk: 26100
          features: "OptionId.SigningTools"

      - name: Build workspace packages
        run: bun run build

      - name: Build MSIX package
        run: bun run desktop:msix

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: msix-package
          path: packages/desktop/artifacts/*.msix
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        # Run even when the build step failed (but only when a tag was supplied —
        # a blank-tag workflow_dispatch builds without attaching), so a produced
        # MSIX still reaches the release. action-gh-release no-ops on an empty
        # glob (fail_on_unmatched_files defaults false).
        if: ${{ !cancelled() && inputs.tag_name != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          draft: false
          # Force the desktop release to be GitHub's "latest" so the Electrobun
          # updater's releases/latest/download/ feed resolves here. Idempotent
          # across the concurrent bundler attach jobs.
          make_latest: true
          files: packages/desktop/artifacts/*.msix
