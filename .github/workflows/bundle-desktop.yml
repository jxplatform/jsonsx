name: Build Desktop Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-26-intel
            platform: macos-x64
          - os: windows-latest
            platform: windows-x64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            build-essential \
            cmake \
            pkg-config

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix
          wix eula accept wix7

      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /opt/homebrew/Cellar || true
          sudo rm -rf /usr/local/Cellar || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /opt/homebrew/lib/node_modules || true
          sudo rm -rf /Users/runner/.dotnet || true
          sudo rm -rf /Users/runner/Library/Caches/Homebrew || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Build workspace packages
        run: bun run build

      # - name: Import code signing certificate
      #   if: runner.os == 'macOS'
      #   env:
      #     CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      #     CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #   run: |
      #     KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
      #     KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

      #     security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      #     security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      #     echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
      #     security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
      #     rm $RUNNER_TEMP/certificate.p12

      #     security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Write Apple API Key File
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/.apple/keys
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > ~/.apple/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Build desktop installer
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
          ELECTROBUN_APPLEAPIKEYPATH: /Users/runner/.apple/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.APPLE_API_KEY_ID }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bun run desktop:stable

      - name: Clean up signing materials
        if: always() && runner.os == 'macOS'
        run: |
          # security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/.apple/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: packages/desktop/artifacts/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: artifacts/*
