name: Build Desktop Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-26-intel
            platform: macos-x64
          - os: windows-latest
            platform: windows-x64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            build-essential \
            cmake \
            pkg-config

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314.exe" -OutFile wix314.exe
          Start-Process -Wait -FilePath .\wix314.exe -ArgumentList '/install','/quiet','/norestart'
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

      - name: Free disk space (macOS x64)
        if: matrix.platform == 'macos-x64'
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /Applications/Xcode*.app
          echo "Disk space after cleanup:"
          df -h /

      - name: Build workspace packages
        run: bun run build

      - name: Build desktop installer
        run: bun run desktop:stable

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: packages/desktop/artifacts/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Append download table to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          BASE="https://github.com/jxsuite/jx/releases/download/${TAG}"

          # Fetch existing release body (changelog from release-it)
          EXISTING="$(gh release view "$TAG" --json body --jq .body 2>/dev/null || echo "")"

          # Build download table
          TABLE="## Downloads

          | Platform | Architecture | Installer | Archive |
          |----------|-------------|-----------|---------|
          | macOS | Apple Silicon (arm64) | [DMG](${BASE}/stable-macos-arm64-JxStudio.dmg) | [tar.zst](${BASE}/stable-macos-arm64-JxStudio.app.tar.zst) |
          | macOS | Intel (x64) | [DMG](${BASE}/stable-macos-x64-JxStudio.dmg) | [tar.zst](${BASE}/stable-macos-x64-JxStudio.app.tar.zst) |
          | Linux | x64 | [tar.gz](${BASE}/stable-linux-x64-JxStudio-Setup.tar.gz) | [tar.zst](${BASE}/stable-linux-x64-JxStudio.tar.zst) |
          | Windows | x64 | [MSI](${BASE}/Jx.Studio.msi) | [ZIP](${BASE}/stable-win-x64-JxStudio-Setup.zip) |"

          # Combine: existing changelog + download table
          printf '%s\n\n%s\n' "$EXISTING" "$TABLE" > body.md

      - name: Attach artifacts and update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          body_path: body.md
          files: artifacts/*
