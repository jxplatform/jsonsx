name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      # JSON array of the package paths released this run (drives npm publish).
      paths_released: ${{ steps.rp.outputs.paths_released }}
      # Per-component outputs are keyed by the manifest PATH with a `--` delimiter
      # (path prefixing applies to every non-root component). The key contains `/`
      # and `-`, so it MUST be read with bracket/quote syntax, not dot notation.
      desktop_released: ${{ steps.rp.outputs['packages/desktop--release_created'] }}
      desktop_tag: ${{ steps.rp.outputs['packages/desktop--tag_name'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release tags are created by release-please using GITHUB_TOKEN, which does
  # NOT trigger `on: push: tags` workflows. So we invoke the (now reusable)
  # publish + desktop-bundler workflows directly once releases exist.
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      # Publish only the packages actually released this run; all component tags
      # point at github.sha (the release-PR merge commit).
      paths_released: ${{ needs.release-please.outputs.paths_released }}
      sha: ${{ github.sha }}
    secrets: inherit

  # Desktop jobs gate on the DESKTOP component (not the global flag): they build
  # and attach to `desktop-v<version>`, so they must only run when that tag exists.
  # desktop's dependency closure covers ~the whole graph, so this fires on nearly
  # every release anyway.
  desktop-linux:
    needs: release-please
    if: needs.release-please.outputs.desktop_released == 'true'
    uses: ./.github/workflows/bundle-desktop-linux.yml
    with:
      tag_name: ${{ needs.release-please.outputs.desktop_tag }}
    secrets: inherit

  desktop-macos:
    needs: release-please
    if: needs.release-please.outputs.desktop_released == 'true'
    uses: ./.github/workflows/bundle-desktop-macos.yml
    with:
      tag_name: ${{ needs.release-please.outputs.desktop_tag }}
    secrets: inherit

  desktop-windows:
    needs: release-please
    if: needs.release-please.outputs.desktop_released == 'true'
    uses: ./.github/workflows/bundle-desktop-windows.yml
    with:
      tag_name: ${{ needs.release-please.outputs.desktop_tag }}
    secrets: inherit

  build-msix:
    needs: release-please
    if: needs.release-please.outputs.desktop_released == 'true'
    uses: ./.github/workflows/build-msix.yml
    with:
      tag_name: ${{ needs.release-please.outputs.desktop_tag }}
    secrets: inherit

  # Append the platform Downloads table to the desktop release notes (preserves the
  # previous release-it footer). Runs AFTER the bundlers (with if: always()) and
  # builds the table from the assets that actually uploaded, so a failed platform
  # build no longer leaves dead download links. Idempotent: strips any prior
  # Downloads section before re-appending, so re-runs don't stack duplicate tables.
  release-notes-downloads:
    needs: [release-please, desktop-linux, desktop-macos, desktop-windows, build-msix]
    if: always() && needs.release-please.outputs.desktop_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refresh Downloads table in release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.desktop_tag }}
        run: |
          set -euo pipefail
          base="https://github.com/jxsuite/jx/releases/download/${TAG}"

          # Names of assets currently attached to the release.
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          has() { printf '%s\n' "$assets" | grep -qxF "$1"; }
          # A markdown link cell for $2 (asset filename) labelled $1, or an em dash.
          cell() { if has "$2"; then printf '[%s](%s/%s)' "$1" "$base" "$2"; else printf '—'; fi; }
          # Emit a table row only when at least one of its two assets exists.
          emit_row() { # platform arch inst-label inst-file arch-label arch-file
            if has "$4" || has "$6"; then
              printf '| %s | %s | %s | %s |\n' "$1" "$2" "$(cell "$3" "$4")" "$(cell "$5" "$6")"
            fi
          }
          # The MSIX filename embeds the version, so match it by suffix.
          msix_name="$(printf '%s\n' "$assets" | grep -F '.msix' | head -n1 || true)"

          rows="$(
            emit_row 'macOS'   'Apple Silicon' 'DMG'    'stable-macos-arm64-JxStudio.dmg'       'tar.zst' 'stable-macos-arm64-JxStudio.app.tar.zst'
            emit_row 'macOS'   'Intel'         'DMG'    'stable-macos-x64-JxStudio.dmg'         'tar.zst' 'stable-macos-x64-JxStudio.app.tar.zst'
            emit_row 'Linux'   'x64'           'tar.gz' 'stable-linux-x64-JxStudio-Setup.tar.gz' 'tar.zst' 'stable-linux-x64-JxStudio.tar.zst'
            emit_row 'Windows' 'x64'           'MSI'    'JxStudio.msi'                          'ZIP'     'stable-win-x64-JxStudio-Setup.zip'
            if [ -n "$msix_name" ]; then
              printf '| %s | %s | [MSIX](%s/%s) | — |\n' 'Windows' 'Store (MSIX)' "$base" "$msix_name"
            fi
          )"

          # Drop any existing Downloads section, then re-append a fresh one (if we
          # have rows to show). Downloads is always last, so cutting from its
          # header to EOF preserves the release-it body/footer above it.
          body="$(gh release view "$TAG" --json body --jq .body)"
          body_clean="$(printf '%s' "$body" | awk 'BEGIN{keep=1} /^## Downloads[[:space:]]*$/{keep=0} keep{print}')"

          {
            printf '%s\n' "$body_clean"
            if [ -n "$rows" ]; then
              printf '\n## Downloads\n\n'
              printf '| Platform | Architecture | Installer | Archive |\n'
              printf '|----------|--------------|-----------|---------|\n'
              printf '%s\n' "$rows"
            fi
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

  # The Electrobun updater fetches relatively off `releases/latest/download/`, so the
  # desktop release MUST be GitHub's "latest". Every component release created this run
  # shares the merge commit's created_at, so default "latest" selection is
  # non-deterministic. The bundlers force `make_latest: true`, but on a batch that bumps
  # only ai/runtime (outside desktop's closure) no desktop build runs — this guard
  # re-pins the newest existing desktop release so "latest = desktop" holds every time.
  # Desktop bundlers are non-blocking (a flaky platform build must not sink the release), so a
  # release can ship with a missing installer. This verifies the expected downloadable assets
  # (from packages/desktop/release-assets.json) are actually present; on a gap it marks the release
  # pre-release (so pin-desktop-latest doesn't advertise a hole) and opens a tracking issue.
  verify-desktop-assets:
    needs: [release-please, desktop-linux, desktop-macos, desktop-windows, build-msix]
    if: always() && needs.release-please.outputs.desktop_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify expected desktop assets are present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.desktop_tag }}
        run: |
          set -euo pipefail
          expected="$(jq -r '.assets[] | select(.downloadable) | .file' packages/desktop/release-assets.json)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          missing=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! printf '%s\n' "$actual" | grep -qxF "$f"; then
              missing="$missing $f"
            fi
          done <<< "$expected"
          if [ -n "$missing" ]; then
            echo "::warning::Release $TAG is missing expected desktop assets:$missing"
            gh release edit "$TAG" --prerelease
            gh issue create \
              --title "Release $TAG is missing desktop assets" \
              --label release-incomplete \
              --body "Expected downloadable assets (packages/desktop/release-assets.json) missing from $TAG:$missing. Marked pre-release so the latest pin does not advertise a hole." || true
          else
            echo "All expected desktop assets present on $TAG."
          fi

  pin-desktop-latest:
    needs:
      [
        release-please,
        desktop-linux,
        desktop-macos,
        desktop-windows,
        build-msix,
        verify-desktop-assets,
      ]
    if: always() && needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pin newest desktop release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(gh release list --limit 100 --json tagName \
                  --jq '[.[] | select(.tagName | startswith("desktop-v"))][0].tagName')"
          if [ -n "$tag" ]; then
            echo "Pinning $tag as latest"
            gh release edit "$tag" --latest
          else
            echo "No desktop-v* release found; nothing to pin"
          fi
