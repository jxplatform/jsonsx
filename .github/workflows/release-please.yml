name: Release

on:
  push:
    branches:
      - main
  # …and on a schedule, because `push` is no longer reliable on this branch.
  #
  # Under the dependency-autopilot policy (CLAUDE.md) most merges to `main` are auto-merges, and
  # GitHub suppresses the events raised by its own `GITHUB_TOKEN` — so a Dependabot merge produces
  # no `push` event and this workflow would simply never see it. The visible symptom would be a
  # release pull request that silently stops picking up commits.
  #
  # Everything here is idempotent: with nothing new to release, release-please refreshes (or
  # declines to open) its pull request and every downstream job stays gated behind
  # `releases_created`.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      # JSON array of the package paths released this run (drives npm publish).
      paths_released: ${{ steps.rp.outputs.paths_released }}
      # Per-component outputs are keyed by the manifest PATH with a `--` delimiter
      # (path prefixing applies to every non-root component). The key contains `/`
      # and `-`, so it MUST be read with bracket/quote syntax, not dot notation.
      desktop_released: ${{ steps.rp.outputs['packages/desktop--release_created'] }}
      desktop_tag: ${{ steps.rp.outputs['packages/desktop--tag_name'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release tags are created by release-please using GITHUB_TOKEN, which does
  # NOT trigger `on: push: tags` workflows. So we invoke the (now reusable)
  # publish + desktop-bundler workflows directly once releases exist.
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      # Publish only the packages actually released this run; all component tags
      # point at github.sha (the release-PR merge commit).
      paths_released: ${{ needs.release-please.outputs.paths_released }}
      sha: ${{ github.sha }}
    secrets: inherit

  # Desktop jobs gate on the DESKTOP component (not the global flag): they build
  # and attach to `desktop-v<version>`, so they must only run when that tag exists.
  # desktop's dependency closure covers ~the whole graph, so this fires on nearly
  # every release anyway.
  desktop-linux:
    needs: release-please
    if: needs.release-please.outputs.desktop_released == 'true'
    uses: ./.github/workflows/bundle-desktop-linux.yml
    with:
      tag_name: ${{ needs.release-please.outputs.desktop_tag }}
    secrets: inherit

  desktop-macos:
    needs: release-please
    if: needs.release-please.outputs.desktop_released == 'true'
    uses: ./.github/workflows/bundle-desktop-macos.yml
    with:
      tag_name: ${{ needs.release-please.outputs.desktop_tag }}
    secrets: inherit

  desktop-windows:
    needs: release-please
    if: needs.release-please.outputs.desktop_released == 'true'
    uses: ./.github/workflows/bundle-desktop-windows.yml
    with:
      tag_name: ${{ needs.release-please.outputs.desktop_tag }}
    secrets: inherit

  build-msix:
    needs: release-please
    if: needs.release-please.outputs.desktop_released == 'true'
    uses: ./.github/workflows/build-msix.yml
    with:
      tag_name: ${{ needs.release-please.outputs.desktop_tag }}
    secrets: inherit

  # Append the platform Downloads table to the desktop release notes (preserves the
  # previous release-it footer). Runs AFTER the bundlers (with if: always()) and
  # builds the table from the assets that actually uploaded, so a failed platform
  # build no longer leaves dead download links. Idempotent: strips any prior
  # Downloads section before re-appending, so re-runs don't stack duplicate tables.
  release-notes-downloads:
    needs: [release-please, desktop-linux, desktop-macos, desktop-windows, build-msix]
    if: always() && needs.release-please.outputs.desktop_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refresh Downloads table in release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.desktop_tag }}
        run: |
          set -euo pipefail
          base="https://github.com/jxsuite/jx/releases/download/${TAG}"

          # Names of assets currently attached to the release.
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          has() { printf '%s\n' "$assets" | grep -qxF "$1"; }
          # A markdown link cell for $2 (asset filename) labelled $1, or an em dash.
          cell() { if has "$2"; then printf '[%s](%s/%s)' "$1" "$base" "$2"; else printf '—'; fi; }
          # Emit a table row only when at least one of its two assets exists.
          emit_row() { # platform arch inst-label inst-file arch-label arch-file
            if has "$4" || has "$6"; then
              printf '| %s | %s | %s | %s |\n' "$1" "$2" "$(cell "$3" "$4")" "$(cell "$5" "$6")"
            fi
          }
          # The MSIX filename embeds the version, so match it by suffix.
          msix_name="$(printf '%s\n' "$assets" | grep -F '.msix' | head -n1 || true)"

          rows="$(
            emit_row 'macOS'   'Apple Silicon' 'DMG'    'stable-macos-arm64-JxStudio.dmg'       'tar.zst' 'stable-macos-arm64-JxStudio.app.tar.zst'
            emit_row 'macOS'   'Intel'         'DMG'    'stable-macos-x64-JxStudio.dmg'         'tar.zst' 'stable-macos-x64-JxStudio.app.tar.zst'
            emit_row 'Linux'   'x64'           'tar.gz' 'stable-linux-x64-JxStudio-Setup.tar.gz' 'tar.zst' 'stable-linux-x64-JxStudio.tar.zst'
            emit_row 'Windows' 'x64'           'MSI'    'JxStudio.msi'                          'ZIP'     'stable-win-x64-JxStudio-Setup.zip'
            if [ -n "$msix_name" ]; then
              printf '| %s | %s | [MSIX](%s/%s) | — |\n' 'Windows' 'Store (MSIX)' "$base" "$msix_name"
            fi
          )"

          # Drop any existing Downloads section, then re-append a fresh one (if we
          # have rows to show). Downloads is always last, so cutting from its
          # header to EOF preserves the release-it body/footer above it.
          body="$(gh release view "$TAG" --json body --jq .body)"
          body_clean="$(printf '%s' "$body" | awk 'BEGIN{keep=1} /^## Downloads[[:space:]]*$/{keep=0} keep{print}')"

          {
            printf '%s\n' "$body_clean"
            if [ -n "$rows" ]; then
              printf '\n## Downloads\n\n'
              printf '| Platform | Architecture | Installer | Archive |\n'
              printf '|----------|--------------|-----------|---------|\n'
              printf '%s\n' "$rows"
            fi
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

  # The Electrobun updater fetches relatively off `releases/latest/download/`, so the
  # desktop release MUST be GitHub's "latest". Every component release created this run
  # shares the merge commit's created_at, so default "latest" selection is
  # non-deterministic. The bundlers force `make_latest: true`, but on a batch that bumps
  # only ai/runtime (outside desktop's closure) no desktop build runs — this guard
  # re-pins the newest existing desktop release so "latest = desktop" holds every time.
  # Desktop bundlers are non-blocking (a flaky platform build must not sink the release), so a
  # release can ship with a missing installer. This verifies the expected downloadable assets
  # (from packages/desktop/release-assets.json) are actually present; on a gap it marks the release
  # pre-release (so pin-desktop-latest doesn't advertise a hole) and opens a tracking issue.
  verify-desktop-assets:
    needs: [release-please, desktop-linux, desktop-macos, desktop-windows, build-msix]
    if: always() && needs.release-please.outputs.desktop_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify expected desktop assets are present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.desktop_tag }}
        run: |
          set -euo pipefail
          expected="$(jq -r '.assets[] | select(.downloadable) | .file' packages/desktop/release-assets.json)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          missing=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! printf '%s\n' "$actual" | grep -qxF "$f"; then
              missing="$missing $f"
            fi
          done <<< "$expected"
          if [ -n "$missing" ]; then
            echo "::warning::Release $TAG is missing expected desktop assets:$missing"
            gh release edit "$TAG" --prerelease
            gh issue create \
              --title "Release $TAG is missing desktop assets" \
              --label release-incomplete \
              --body "Expected downloadable assets (packages/desktop/release-assets.json) missing from $TAG:$missing. Marked pre-release so the latest pin does not advertise a hole." || true
          else
            echo "All expected desktop assets present on $TAG."
          fi

  # `release` is the branch a Nix consumer pins: `nix run github:jxsuite/jx/release`. It must only
  # Ever point at a commit that BUILDS, and nothing had ever built the flake in CI — so the branch
  # Advances behind a real `nix build` at the release tag rather than on faith.
  #
  # The desktop component is the right gate: the flake's only output is `jx-studio`, whose version
  # Comes from packages/desktop/package.json. A release that carries only, say, `schema` leaves
  # `release` where it is, which is the correct answer for a ref that names an app.
  nix-build:
    needs: release-please
    if: needs.release-please.outputs.desktop_released == 'true'
    uses: ./.github/workflows/nix.yml
    with:
      ref: ${{ needs.release-please.outputs.desktop_tag }}
      publish: true
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # aarch64-linux has never been built by anything. `packages/desktop/package.nix` claims it in
  # `meta.platforms` and CI has only ever run x86_64, so the first person to find out whether the
  # host-filtered tarball set resolves on arm should be us, at a release, and not a user.
  #
  # It is deliberately absent from `advance-release-branch`'s `needs`. That job gates the branch
  # NixOS users pin on `nix-build.result`; letting a first-ever aarch64 failure freeze `release`
  # would strand every x86 user over an architecture nobody has received yet. Promote it to a gate
  # once it has been green across a few releases.
  nix-build-arm:
    needs: release-please
    if: needs.release-please.outputs.desktop_released == 'true'
    uses: ./.github/workflows/nix.yml
    with:
      ref: ${{ needs.release-please.outputs.desktop_tag }}
      runner: ubuntu-24.04-arm
      publish: true
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Advance `release` to the commit that just released and built. A plain (fast-forward) push, never
  # A force: `release` only ever moves forward along main's history, so a non-fast-forward here means
  # Something is wrong and should fail loudly rather than rewrite the branch NixOS users are on.
  #
  # If `nix-build` fails, `release` stays where it is and an issue is opened. A stale ref that works
  # Beats a fresh one that does not.
  advance-release-branch:
    needs:
      [
        release-please,
        nix-build,
        desktop-linux,
        desktop-macos,
        desktop-windows,
        build-msix,
        verify-desktop-assets,
      ]
    if: always() && needs.release-please.outputs.desktop_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.desktop_tag }}
          fetch-depth: 0
      - name: Advance `release`, or say why it did not move
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.desktop_tag }}
          NIX_RESULT: ${{ needs.nix-build.result }}
        run: |
          set -euo pipefail
          if [ "$NIX_RESULT" != "success" ]; then
            echo "::warning::nix-build was $NIX_RESULT for $TAG; leaving \`release\` where it is"
            gh issue create \
              --title "\`release\` did not advance to $TAG" \
              --label release-incomplete \
              --body "The Nix build at $TAG was $NIX_RESULT, so \`release\` still points at the previous release. Anyone on \`github:jxsuite/jx/release\` keeps the older, working tree until this is fixed." || true
            exit 0
          fi
          git push origin "$(git rev-parse HEAD):refs/heads/release"
          echo "release -> $TAG ($(git rev-parse --short HEAD))"

  # Prove a NixOS user gets a DOWNLOAD rather than a build. Nothing else in this pipeline can:
  # `nix-build` proves the tree builds, and the Cachix push is best-effort by design, so without
  # this job a cache that silently holds the wrong store path looks exactly like one that works.
  #
  # Two assertions, so a failure says which half broke:
  #
  #   1. Does the cache hold the path? `nix path-info --store` asks Cachix and downloads nothing.
  #   2. Does the user's own command find it? `nix build --max-jobs 0` means SUBSTITUTE OR FAIL,
  #      run against `github:jxsuite/jx/release` exactly as docs/start/install.md tells people to,
  #      with --accept-flake-config so the flake's own nixConfig does the wiring.
  #
  # (2) is also the only thing that proves the store path CI published is the one a `github:` flake
  # fetch evaluates to. CI builds a git checkout and a user builds a tarball; if those ever stop
  # agreeing, every consumer quietly goes back to building from source and nothing else notices.
  #
  # It gates on `nix-build`, not on `advance-release-branch`, because that job exits 0 even when it
  # declines to move the branch — so its success does not mean `release` advanced, and `nix-build`
  # is the condition it actually tests.
  verify-cache:
    needs: [release-please, nix-build, nix-build-arm, advance-release-branch]
    if: always() && needs.nix-build.result == 'success' && needs.release-please.outputs.desktop_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main @ 2026-08-21
        with:
          extra-conf: |
            accept-flake-config = true

      - name: A consumer substitutes instead of building
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.desktop_tag }}
          ARM_RESULT: ${{ needs.nix-build-arm.result }}
        run: |
          set -euo pipefail
          ref="github:${GITHUB_REPOSITORY}/release"
          cache="https://jxsuite.cachix.org"
          problems=""

          # Evaluation only — this is the path a user's Nix will ask for.
          for system in x86_64-linux aarch64-linux; do
            # Not `out=$(...)` bare: under `set -e` a failed eval would kill the script before it
            # could report anything, turning "the cache is broken" into a silent red X.
            if ! out="$(nix eval --raw "${ref}#packages.${system}.default.outPath" 2>&1)"; then
              problems="${problems}- evaluating the $system package failed: \`$out\`"$'\n'
              continue
            fi
            echo "$system -> $out"
            if nix path-info --store "$cache" "$out" >/dev/null 2>&1; then
              echo "::notice::$cache holds $out"
            elif [ "$system" = "aarch64-linux" ] && [ "$ARM_RESULT" != "success" ]; then
              echo "::notice::aarch64 leg was $ARM_RESULT; its absence from the cache is expected"
            else
              problems="${problems}- \`$cache\` does not hold the $system path \`$out\`"$'\n'
            fi
          done

          # Substitute or fail: --max-jobs 0 refuses to build anything at all.
          if nix build "$ref" --accept-flake-config --max-jobs 0 --no-link -L; then
            echo "::notice::a consumer substitutes the entire closure"
          else
            problems="${problems}- \`nix build $ref --max-jobs 0\` failed, so a consumer still builds from source"$'\n'
          fi

          if [ -n "$problems" ]; then
            echo "::warning::the binary cache does not serve $TAG"
            gh issue create \
              --title "Binary cache does not serve $TAG" \
              --label release-incomplete \
              --body "$(printf '%s\n%s\n' "A NixOS user on \`github:jxsuite/jx/release\` builds Jx Studio from source instead of downloading it. The release itself is fine; only the cache is." "$problems")" || true
          else
            echo "Cache serves $TAG on both architectures."
          fi

  # The site ships WITH the release rather than with the merge to `main`, so the docs a visitor
  # reads describe the app they can download. deploy-site.yml's header explains why this is a
  # `uses:` call and not an `on: push: branches: [release]` trigger.
  #
  # Gated on `nix-build`, not on `advance-release-branch`, for the same reason `verify-cache` is:
  # that job exits 0 even when it declines to move the branch. Publishing on its success alone
  # would put documentation for a tree that `release` refused to ship.
  #
  # It names the TAG, not the branch. They are the same commit here, and naming the tag keeps the
  # deploy pinned to the release it belongs to even if something else moves `release` meanwhile.
  deploy-site:
    needs: [release-please, nix-build, advance-release-branch]
    if: always() && needs.nix-build.result == 'success' && needs.release-please.outputs.desktop_released == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      ref: ${{ needs.release-please.outputs.desktop_tag }}

  # Did the release actually SHIP? Nothing asked before, and for six weeks the answer was no.
  #
  # Two ways to lose a component, both of which leave every job in this workflow green:
  #
  #   1. release-please skips a component whose changelog carries a raw `<tag>` — it logs
  #      "Pull request contains releases, but not for component: starters", creates the other 18,
  #      and exits 0. The manifest still claims the version. (commitlint.config.js has the full
  #      mechanism; `checks` now blocks the commit subjects that cause it.)
  #   2. The `release-please` job dies PART WAY THROUGH after creating some releases — a GitHub 5xx
  #      during its commit-history walk, which is precisely what an un-tagged component provokes.
  #      Re-running it then finds the pull request already labelled `autorelease: tagged`, so
  #      `releases_created` comes back FALSE and `publish`, all four desktop bundlers, `nix-build`
  #      and `deploy-site` skip. That is how desktop-v2.2.0 shipped with no installers at all.
  #
  # So this runs on `always()` and is gated on NOTHING: a run that released nothing is exactly the
  # run that needs checking. `needs: publish` only orders it after the registry has been written.
  #
  # It fails the run rather than warning like `verify-desktop-assets` does, because its subject is
  # not cosmetic: `@jxsuite/starters` sat at 1.2.2 on npm while `@jxsuite/create@1.3.2` shipped
  # depending on `^1.5.0`, so `npm install @jxsuite/create` was unresolvable for everyone. Nothing
  # `needs:` this job, so a red X here blocks no other release work.
  verify-release-integrity:
    needs: [release-please, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      # `install: false` — the script reads package.json files with node builtins and shells out to
      # `gh` and `npm`. It has no dependency to install, and a job whose whole purpose is to report
      # A broken release must not be able to fail on `--frozen-lockfile` instead.
      - uses: ./.github/actions/setup-bun
        with:
          install: false
      - name: Every version in the manifest must have a release and be on npm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if bun scripts/check-release-integrity.ts 2>&1 | tee integrity.txt; then
            exit 0
          fi
          echo "::error::the manifest claims versions that never shipped"

          # One open issue, not one per run: this stays red until someone acts, and the daily
          # schedule would otherwise comment every morning.
          title="Released versions that never shipped"
          open="$(gh issue list --state open --label release-incomplete \
                    --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$open" ]; then
            gh issue create --title "$title" --label release-incomplete --body "$(
              printf '%s\n\n```\n%s\n```\n' \
                "\`bun run release:integrity\` on \`main\`, from [this run]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)." \
                "$(cat integrity.txt)"
            )" || true
          else
            echo "tracked by #$open"
          fi
          exit 1

  pin-desktop-latest:
    needs:
      [
        release-please,
        desktop-linux,
        desktop-macos,
        desktop-windows,
        build-msix,
        verify-desktop-assets,
      ]
    if: always() && needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pin newest desktop release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(gh release list --limit 100 --json tagName \
                  --jq '[.[] | select(.tagName | startswith("desktop-v"))][0].tagName')"
          if [ -n "$tag" ]; then
            echo "Pinning $tag as latest"
            gh release edit "$tag" --latest
          else
            echo "No desktop-v* release found; nothing to pin"
          fi
