# Dependency autopilot. Every entry here exists to be MERGED WITHOUT A HUMAN — see
# .github/workflows/dependabot-auto-merge.yml, which enables GitHub's auto-merge on each of these
# pull requests, and the `ci` required status check on `main`, which is the thing that actually
# decides. Nothing below relaxes a check; the whole design is "let the suite be the reviewer".
#
# Three ecosystems, deliberately NOT consolidated. `multi-ecosystem-groups` would put all of them
# in one pull request, and that is the wrong trade here: `.github/**` is classified NO_TESTS in
# scripts/ci/affected.ts, so an Actions bump costs one `checks` job — while `bun.lock` is in that
# script's GLOBAL list and costs the entire ~22-job matrix. Merging the two means every action
# version bump pays for a full run of the test suite.
#
# THE ONE THING TO CHECK BEFORE BLAMING THE CONFIG: Dependabot's updater image pins Bun 1.3.14 and
# refuses a `bun.lock` whose `lockfileVersion` is greater than 1 (`DependencyFileNotSupported`).
# Bun 1.4 raised the default for NEW lockfiles to 2 and preserves an existing 1, so this repository
# is fine today at `lockfileVersion: 1` — and would silently lose bun updates the first time
# somebody regenerates the lockfile from scratch. scripts/dependabot-config.test.ts asserts it.
version: 2

updates:
  # ── GitHub Actions ───────────────────────────────────────────────────────────────────────────
  #
  # Cheap: `.github/**` reaches no test workspace, so these run `checks` and nothing else. Daily
  # and grouped into one pull request; "daily" is weekdays-only in Dependabot's vocabulary.
  #
  # KNOWN GAP, accepted deliberately: bundle-desktop-{linux,macos,windows}.yml, build-msix.yml and
  # publish.yml are `workflow_call`-only, reachable exclusively from release-please.yml at a release
  # tag. No pull request check ever executes them, so an action bump inside those files is first
  # exercised during a real release. The release pipeline is built for that — a failed bundler
  # leaves `release` where it is and opens an issue (release-please.yml, `advance-release-branch`
  # and `verify-desktop-assets`) — but it is the one place here where green does not mean tested.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]

  # ── Bun (the whole workspace) ────────────────────────────────────────────────────────────────
  #
  # ONE root entry covers all 21 workspace manifests. Dependabot's bun file fetcher reads the root
  # package.json's `workspaces` globs and fetches every member's package.json, rewriting each one
  # and regenerating the single root bun.lock. `directories: ["/packages/*", …]` would be WRONG:
  # a sub-directory bun job resolves the lockfile upward to the same root bun.lock, which is the
  # "overlap in directories" the documentation forbids, and produces duplicate pull requests.
  #
  # `versioning-strategy` is deliberately absent — it is documented for bundler, cargo, composer,
  # helm, mix, npm, pip, pub and uv, and bun is not among them, so setting it does nothing.
  #
  # bun.nix is NOT regenerated by these pull requests. It is a pure function of bun.lock and no bot
  # can run bun2nix inside a Dependabot branch and have the result re-checked (a GITHUB_TOKEN push
  # creates no check runs on the new head — measured on PR #131, whose bot-pushed head carries zero
  # checks to this day). So the file is allowed to lag on `main` between releases and is brought
  # back into agreement on the release pull request by .github/workflows/release-bun-nix.yml.
  # `nix.yml` regenerates it in the working tree before every build, so the Nix check on these
  # pull requests still answers the real question: does THIS dependency set build?
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    # Two groups, so one wedged major does not hold routine patches hostage. Ungrouped dependencies
    # would each get their own pull request; `patterns: ["*"]` in both means there are none.
    #
    # `dependency-type` is NOT used: the groups table documents it for bundler, composer, mix,
    # maven, npm and pip only. Dev/production is not a distinction Dependabot will honour here.
    groups:
      bun-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      bun-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
    # Since 2026-07-14 a three-day cooldown applies to every version update even with no block
    # here, and the days keys are bounded at 1 — `default-days: 0` is not expressible. Three days
    # of quarantine is the supply-chain reason it exists and is kept; patches, whose blast radius
    # is smallest and whose fixes are most wanted, are cut to the floor. To go to zero delay the
    # documented lever is `exclude: ["*"]` (exclude wins over include), which trades that
    # protection away — do it knowingly, not by default.
    cooldown:
      default-days: 3
      semver-patch-days: 1
    # release-please owns every published @jxsuite range — it rewrites them inside the release
    # commit via `extra-files`, and `bun run templates:check` fails CI when they disagree with the
    # version that shipped. A Dependabot bump of the same range is a second writer on the same
    # line. Workspace members already resolve through `workspace:` (which Dependabot skips), so
    # this is belt-and-braces for anything that ever stops being one.
    ignore:
      - dependency-name: "@jxsuite/*"

  # ── Nix flake inputs ─────────────────────────────────────────────────────────────────────────
  #
  # GA since 2026-04-07. It reads flake.nix AND flake.lock (both required), updates ROOT-level
  # inputs only, and opens one pull request per outdated input unless grouped — this flake has
  # four (nixpkgs, flake-parts, process-compose-flake, bun2nix), so ungrouped that is four full
  # `nix build` runs a week for what is one decision.
  #
  # Weekly, not daily: `nixpkgs-unstable` moves several times a day, and each bump is a real
  # rebuild of the one store path cache.nixos.org cannot serve. Version updates only — Dependabot
  # has no security updates for Nix — and `semver-*-days` is unsupported here (flake inputs are
  # commits, not versions), so cooldown is the plain `default-days` form.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      flake-inputs:
        applies-to: version-updates
        patterns: ["*"]
    cooldown:
      default-days: 3
